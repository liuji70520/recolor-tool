name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync to Space
        uses: huggingface/hub-sync@main
        with:
          repo_type: space
          huggingface_repo_id: liu-ji/recolor-tool
          hf_token: ${{ secrets.HF_TOKEN }}
